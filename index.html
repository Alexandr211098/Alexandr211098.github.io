$("#main").addEventListener("change",e=>{const p=e.target.closest("[data-prepi]");if(!p)return;const a=prepItems(sel),i=+p.dataset.prepi;if(a[i])a[i].c=p.checked?1:0;S.prep[ymd(sel)]=a;save()});
$("#main").addEventListener("keydown",e=>{if(e.target.id=="prepIn"&&e.key=="Enter"){e.preventDefault();addPrep()}});
function remind(){
 if(!S.rem||!S.rem.on||!("Notification" in window)||Notification.permission!="granted")return;
 const n=new Date(),k=ymd(n),e=S.plan[k],[h,m]=(S.rem.t||"18:00").split(":");

 S.remAt=k;save();new Notification("FitCoach: время тренировки",{body:NM[e.i]+" · "+e.f+" · ~"+DUR[e.i]+" мин"});
}

const nDemo=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();

async function showExerciseDemo(name){
 const my=++mtok,spec=DEMO_MAP[name],link=`<a class="demo-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+" правильная техника выполнения")}" target="_blank" rel="noopener">▶ Видео-разбор техники</a>`;
 const view=(img,note)=>{if(my!=mtok)return;openModal(`<h2>${esc(name)}</h2>${img?`<img class="demo-gif" onerror="this.style.display='none'" src="${esc(img)}" alt="Демонстрация: ${esc(name)}">`:""}<div class="sub">${note}</div><div class="row">${link}</div>${img?'<div class="sub demo-credit">Анимации: ExerciseDB</div>':""}`)};
 if(!spec)return view("","Для этого упражнения нет анимации — откройте видео с техникой.");
 if(spec.gif)return view(spec.gif,"");
 if(demoCache[name])return view(demoCache[name],"");
 view("","Ищу анимацию…");
 try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);let j;
  try{j=await(await fetch("https://oss.exercisedb.dev/api/v1/exercises/search?q="+encodeURIComponent(spec.q)+"&limit=10",{signal:c.signal})).json()}finally{clearTimeout(t)}
  const it=matchDemo(name,(j.data&&j.data.exercises)||j.data||[]);if(!it)throw 0;
  demoCache[name]=it.gifUrl;try{localStorage.fcdemos=JSON.stringify(demoCache)}catch(e){}view(it.gifUrl,"");
 }catch(e){view("","Анимацию загрузить не удалось — используйте видео с техникой.")}
}

let MSEL=new Set();
function exListHTML(e,d){
 if(!MSEL.size)return "";
 const all=workout(e,d),items=all.filter(x=>musclesOf(x[0]).some(k=>MSEL.has(k)));
 const head=`<div class="row" style="margin-top:12px;justify-content:space-between;align-items:center"><b>${MSEL.size?"Упражнения для выбранных мышц":"Упражнения"}</b><span class="sub">${items.length} из ${all.length}</span></div>`;
 if(!items.length){const sug=[...new Set(Object.values(LIB).flat().map(x=>x[0]))].filter(n=>musclesOf(n).some(k=>MSEL.has(k))).slice(0,6);
  return head+`<div class="sub" style="margin-top:6px">В этой тренировке для этих мышц упражнений нет${sug.length?". Можно добавить:":" — снимите выбор."}</div>`+sug.map(n=>`<button class="exbtn" data-exercise="${esc(n)}"><span>${esc(n)}</span><span class="sub">техника ›</span></button>`).join("");}
 return head+items.map(x=>`<button class="exbtn" data-exercise="${esc(x[0])}"><span>${esc(x[0])}</span><span class="sub">${esc(x[1])} ›</span></button>`).join("");
}
const muscleHint=()=>MSEL.size?"<b>Выбрано:</b> "+esc([...MSEL].map(k=>MRU[k]).join(", ")):"Выберите мышцы";
function muscleCard(e,d){
 return `<div class="glass card"><h2>Какие мышцы тренируем сегодня?</h2><div class="mapbox" id="mapBox">${MSVG}</div><div class="sub" id="mi" style="margin-top:8px">${muscleHint()}</div><div id="exList">${exListHTML(e,d)}</div></div>`;
}
function musclePick(k){
 if(MSEL.has(k))MSEL.delete(k);else MSEL.add(k);
 paintSel();
}
function paintSel(){
 const box=$("#mapBox");if(box)box.querySelectorAll("path[data-mk]").forEach(p=>p.classList.toggle("on",MSEL.has(p.getAttribute("data-mk"))));
 const list=$("#exList");if(list)list.innerHTML=exListHTML(entry(sel),sel);
 const mi=$("#mi");if(mi)mi.innerHTML=muscleHint();
}

const PAL=[[1.2,"Сидячий образ жизни"],[1.375,"Лёгкая активность"],[1.55,"Умеренная активность"],[1.725,"Высокая активность"]],ALG=["Лактоза","Глютен","Орехи","Яйца","Морепродукты"];

const onboard=()=>goalsWizard("full");

const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.fct=t}catch(e){}};
setTheme((()=>{try{return localStorage.fct}catch(e){}})()||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
