 const view=(img,note)=>{if(my!=mtok)return;openModal(`<h2>${esc(name)}</h2>${img?`<img class="demo-gif" onerror="this.style.display='none'" src="${esc(img)}" alt="Демонстрация: ${esc(name)}">`:""}<div class="sub">${note}</div><div class="row">${link}</div>${img?'<div class="sub demo-credit">Анимации: ExerciseDB</div>':""}`)};
 if(!spec)return view("","Для этого упражнения нет анимации — откройте видео с техникой.");
 if(spec.gif)return view(spec.gif,"");
 if(demoCache[name])return view(demoCache[name],"");
 view("","Ищу анимацию…");
 try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);let j;
  try{j=await(await fetch("https://oss.exercisedb.dev/api/v1/exercises/search?q="+encodeURIComponent(spec.q)+"&limit=10",{signal:c.signal})).json()}finally{clearTimeout(t)}
  const it=matchDemo(name,(j.data&&j.data.exercises)||j.data||[]);if(!it)throw 0;
  demoCache[name]=it.gifUrl;try{localStorage.fcdemos=JSON.stringify(demoCache)}catch(e){}view(it.gifUrl,"");
 }catch(e){view("","Анимацию загрузить не удалось — используйте видео с техникой.")}
}
/* ───── схема мышц ───── */
const MRU={BICEPS:"Бицепс",FOREARMS:"Предплечья",CHEST:"Грудные",TRICEPS:"Трицепс",ABDOMINALS:"Пресс",OBLIQUES:"Косые мышцы живота",QUADRICEPS:"Квадрицепсы",SHOULDERS:"Плечи",CALVES:"Икры",TRAPS:"Трапеции",BACK:"Спина",HAMSTRINGS:"Бицепс бедра",GLUTES:"Ягодицы"};
const MX=[[/румынск/,["HAMSTRINGS","GLUTES","BACK"]],[/мостик|голубь/,["GLUTES","HAMSTRINGS"]],[/обратные отжим|узкие/,["TRICEPS","CHEST"]],[/пике|жим гантелей стоя/,["SHOULDERS","TRICEPS"]],[/присед|выпад|болгар/,["QUADRICEPS","GLUTES"]],[/отжим|жим/,["CHEST","TRICEPS","SHOULDERS"]],[/подтяг|тяга/,["BACK","BICEPS","TRAPS"]],[/носки/,["CALVES"]],[/боков|вращ/,["OBLIQUES","ABDOMINALS"]],[/планк|скруч|жук|ног лёжа|скалолаз|кошка/,["ABDOMINALS","BACK"]],[/берпи|финишер|интервал|бег|ходьба|велосип/,["QUADRICEPS","HAMSTRINGS","CALVES","GLUTES"]]];
const musclesOf=n=>(MX.find(r=>r[0].test(n.toLowerCase()))||[0,[]])[1];
function bodySvg(act,col){
 const m=(el,t,a)=>`<${t} class="m${act.has(el)?" on":""}" data-elem="${el}" ${a}/>`,E=(x,y,rx,ry)=>`cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"`;
 const P=(el,c,dx,y,rx,ry)=>m(el,"ellipse",E(c-dx,y,rx,ry))+m(el,"ellipse",E(c+dx,y,rx,ry));
 const body=c=>`<circle class="mb" cx="${c}" cy="34" r="22"/><rect class="mb" x="${c-36}" y="70" width="72" height="136" rx="26"/><rect class="mb" x="${c-66}" y="84" width="22" height="118" rx="11"/><rect class="mb" x="${c+44}" y="84" width="22" height="118" rx="11"/><rect class="mb" x="${c-34}" y="196" width="30" height="230" rx="14"/><rect class="mb" x="${c+4}" y="196" width="30" height="230" rx="14"/>`;
 const F=c=>P("SHOULDERS",c,40,88,14,13)+P("CHEST",c,17,108,19,15)+m("ABDOMINALS","rect",`x="${c-16}" y="126" width="32" height="64" rx="10"`)+P("OBLIQUES",c,26,158,8,26)+P("BICEPS",c,55,124,9,21)+P("FOREARMS",c,55,172,8,24)+P("QUADRICEPS",c,19,266,15,46)+P("CALVES",c,19,372,11,38);
 const B=c=>m("TRAPS","ellipse",E(c,86,26,12))+P("SHOULDERS",c,40,92,14,13)+m("BACK","rect",`x="${c-28}" y="100" width="56" height="74" rx="16"`)+P("TRICEPS",c,55,124,9,21)+P("FOREARMS",c,55,172,8,24)+P("GLUTES",c,17,206,18,16)+P("HAMSTRINGS",c,19,276,15,40)+P("CALVES",c,19,372,11,38);
 return `<svg id="msvg" viewBox="0 0 535 462" xmlns="http://www.w3.org/2000/svg" style="--mc:${col}">${body(115)}${F(115)}${body(412)}${B(412)}<text class="mt" x="115" y="456" text-anchor="middle">Спереди</text><text class="mt" x="412" y="456" text-anchor="middle">Сзади</text></svg>`;
}
function muscleCard(e,d){
 const act=new Set(workout(e,d).flatMap(x=>musclesOf(x[0])));
 return `<div class="glass card"><h2>Какие мышцы работают</h2>${bodySvg(act,CL[e.i])}<div class="sub" id="mi" style="margin-top:6px">Нажмите на мышцу, чтобы увидеть упражнения.</div></div>`;
}
function muscleInfo(el){
 const e=entry(sel),ex=e.t=="w"?workout(e,sel).filter(x=>musclesOf(x[0]).includes(el)).map(x=>x[0]):[],i=$("#mi");
 if(i)i.innerHTML="<b>"+MRU[el]+"</b>: "+(ex.length?esc(ex.join(", ")):"в этой тренировке не нагружается");
}
/* ───── настройка целей (онбординг) ───── */
const PAL=[[1.2,"Сидячий образ жизни"],[1.375,"Лёгкая активность"],[1.55,"Умеренная активность"],[1.725,"Высокая активность"]],ALG=["Лактоза","Глютен","Орехи","Яйца","Морепродукты"];
const AL={"Лактоза":["milk","cream","cheese","butter","yogurt","yoghurt"],"Глютен":["flour","bread","pasta","wheat","noodle","spaghetti","couscous"],"Орехи":["nut","almond","walnut","cashew","pistachio","hazelnut"],"Яйца":["egg"],"Морепродукты":["shrimp","prawn","fish","salmon","crab","squid","mussel","clam","tuna","cod"]};
let ob,obi;
function onboard(){ob={...S.p,alg:[...(S.p.alg||[])]};obi=0;obv()}
function obv(){
 const o=ob,rg=(k,mn,mx,u)=>`<div class="rr"><b id="${k}_v">${o[k]} ${u}</b><input type="range" id="${k}" data-u="${u}" min="${mn}" max="${mx}" value="${o[k]}" style="width:100%"></div>`,
 ch=(k,a)=>`<div class="row">${a.map(x=>`<button data-o="${k}" data-v="${x[0]}"${o[k]==x[0]?' class="on"':""}>${x[1]}</button>`).join("")}</div>`;
 let b;
 if(obi==0)b=`<h2>Пол и возраст</h2>${ch("sex",[["Ж","Женщина"],["М","Мужчина"]])}${rg("age",14,80,"лет")}`;
 else if(obi==1)b=`<h2>Рост и вес</h2>${rg("h",140,220,"см")}${rg("w",40,160,"кг")}`;
 else if(obi==2)b=`<h2>Желаемый вес</h2>${rg("tw",40,160,"кг")}<div class="sub">Комфортный темп в неделю</div>${ch("rate",[[.25,"0,25 кг"],[.5,"0,5 кг"],[.75,"0,75 кг"]])}<div class="sub" id="est" style="margin-top:8px"></div>`;
 else if(obi==3)b=`<h2>Ваша активность</h2>${PAL.map(x=>`<div class="meal${o.act==x[0]?" on":""}" data-o="act" data-v="${x[0]}"><b>${x[1]}</b></div>`).join("")}`;
 else if(obi==4)b=`<h2>Питание</h2><div class="sub">Тип питания</div>${ch("diet",[["Без ограничений","Без ограничений"],["Рыба и овощи","Рыба и овощи"],["Вегетарианство","Вегетарианство"]])}<div class="sub" style="margin-top:10px">Аллергии и исключения</div><div class="row">${ALG.map(a=>`<button data-al="${a}"${o.alg.includes(a)?' class="on"':""}>${a}</button>`).join("")}</div>`;
 else{const c=calc(o);b=`<h2>Ваш баланс</h2><div class="ex"><span>Базовый обмен (BMR)</span><span>${c.bmr} ккал</span></div><div class="ex"><span>С учётом активности (TDEE)</span><span>${c.tdee} ккал</span></div><div class="ex"><span><b>Цель на день</b></span><span><b>${c.kc} ккал</b></span></div><div class="ex"><span>Белки / жиры / углеводы</span><span>${c.pr} / ${c.f} / ${c.c} г</span></div><div class="sub" style="margin-top:8px">Золотое правило: рацион не опускается ниже базового обмена — так сохраняются гормональный фон и мышцы.</div>`}
 openModal(`<div class="sub">Шаг ${obi+1} из 6</div>${b}<div class="row" style="margin-top:12px">${obi?'<button id="ob_b">Назад</button>':""}<button id="ob_n" class="on" style="flex:1">${obi==5?"Начать":"Продолжить"}</button></div>`);
 const est=()=>{const df=Math.abs(o.tw-o.w);$("#est").textContent=df?"Ориентир: ~"+Math.ceil(df/o.rate)+" нед. (до "+add(today,Math.ceil(df/o.rate)*7).toLocaleDateString("ru-RU")+")":"Вес менять не нужно — поддерживаем форму."};
 if(obi==2)est();
 document.querySelectorAll("#modal [type=range]").forEach(r=>r.oninput=()=>{o[r.id]=+r.value;if(r.id=="tw")o.tt=1;$("#"+r.id+"_v").textContent=r.value+" "+r.dataset.u;if(obi==2)est()});
 document.querySelectorAll("#modal [data-o]").forEach(x=>x.onclick=()=>{o[x.dataset.o]=["rate","act"].includes(x.dataset.o)?+x.dataset.v:x.dataset.v;obv()});
 document.querySelectorAll("#modal [data-al]").forEach(x=>x.onclick=()=>{const a=x.dataset.al;o.alg=o.alg.includes(a)?o.alg.filter(y=>y!=a):[...o.alg,a];obv()});
 if($("#ob_b"))$("#ob_b").onclick=()=>{obi--;obv()};
 $("#ob_n").onclick=()=>{if(obi==1&&!o.tt)o.tw=o.w;if(obi<5){obi++;obv()}else{Object.assign(S.p,o,{ob:1});save();$("#modal").innerHTML="";build();refresh()}};
}
/* тема */
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.fct=t}catch(e){}};
setTheme((()=>{try{return localStorage.fct}catch(e){}})()||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("#th").onclick=()=>setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark");
initAuth();
if(!okS)alert("Браузер не разрешает сохранять данные (приватный режим?). Настройки пропадут после закрытия страницы — используйте «Копия данных» в профиле.");
</script></body></html>
